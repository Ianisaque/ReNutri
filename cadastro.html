<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/logo-icon.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro de Empresas - ReNutri</title>
</head>
<body class="page-cadastro">

    <!-- MENU DE NAVEGAÇÃO -->
    <header>
        <nav>
            <a href="index.html">
                <img src="img/logo.png" class="logo" alt="logo-startup">
            </a>
            <div class="nav-links">
                <a href="como-funciona.html">Como Funciona</a>
                <a href="empresas.html">Para Empresas</a>
                <a href="ongs.html">Para Ongs</a>
                <a href="sobre.html">Sobre Nós</a>
                <a href="produtos.html">Produtos</a>
            </div>
        </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
        <div class="section-title">
            <h2>Cadastre sua Empresa</h2>
            <p>Junte-se à ReNutri, reduza o desperdício e recupere seus custos.</p>
        </div>

        <!-- FORMULÁRIO -->
        <div class="form-container">
            <!-- Sem action, o JS vai controlar o envio -->
            <form id="empresa-form" novalidate>
                
                <div class="form-group">
                    <label for="nome">Nome da Empresa *</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Padaria Pão Quente" required>
                    <span class="error-msg" id="error-nome"></span>
                </div>

                <div class="form-group">
                    <label for="email">E-mail Comercial *</label>
                    <input type="email" id="email" name="email" placeholder="contato@empresa.com" required>
                    <span class="error-msg" id="error-email"></span>
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone / WhatsApp *</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required>
                    <span class="error-msg" id="error-telefone"></span>
                </div>

                <div class="form-group">
                    <label for="tipo">Tipo de Comércio *</label>
                    <select id="tipo" name="tipo" required>
                        <option value="" disabled selected>Selecione uma opção...</option>
                        <option value="padaria">Padaria</option>
                        <option value="hortifruti">Hortifrúti</option>
                        <option value="mercado">Mercado / Mercearia</option>
                        <option value="outro">Outro</option>
                    </select>
                    <span class="error-msg" id="error-tipo"></span>
                </div>

                <button type="submit" class="btn-primary btn-submit" id="btn-submit">
                    Enviar Cadastro
                </button>
                
                <!-- Mensagem de Sucesso -->
                <div id="form-success" class="alert alert-success mt-3" style="display: none;" role="alert">
                    Cadastro enviado com sucesso! Entraremos em contato em breve.
                </div>
            </form>
        </div>
    </main>

    <!-- RODAPÉ DA PÁGINA -->
    <footer>
        <p>&copy; 2026 ReNutri. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
